function pathNext(o,gx,gy){const sx=Math.floor(o.x/T),sy=Math.floor(o.y/T),h=PFW>>1,ox0=sx-h,oy0=sy-h,gi=Math.floor(gx/T)-ox0,gj=Math.floor(gy/T)-oy0;

function endWave(){G.wact=0;const b=10+G.wave*6;G.cr+=b;
 if(G.wave>=4){G.wave=5;G.it=INV_EVERY;G.warned=0;say("A partir de agora a cidade sofre uma invasão a cada 15 minutos, com aviso 1 minuto antes.");if(G.ld){G.ch=3;showBanner("VITÓRIA!")}else{showBanner("A VILA RESISTIU!");say("O exército recuou! Agora vá à Fortaleza do Lorde, bem ao sul da vila, e derrote o Lorde Orc.")}saveDirty=1;return}

function villageFall(){mons=mons.filter(m=>{if(m.inv){m.gone=1;MIDX.delete(m.id);return false}return true});G.vhp=vmax();G.wact=0;G.wt=20;G.spawnLeft=0;showBanner("A VILA CAIU!");say("Os slimes reconstroem tudo… a onda "+G.wave+" recomeça em 20s.")}
function updVillage(dt){cityTick(dt);if(G.ch!==2||G.wave>=5)return;
 if(!G.wact){G.wt-=dt;if(G.wt<=0)startWave()}
 else if(G.spawnLeft>0){G.st-=dt;if(G.st<=0){G.st=1.1;G.spawnLeft--;spawnInvader(G.pool,WAVES[G.wave].el)}}
 else if(!mons.some(m=>m.inv))endWave();
 if(G.vhp<=0)villageFall();
}

const padRest=[null,null,null,null],DZ=.3;
function stick(i,x,y){let r=padRest[i];if(!r){r=padRest[i]=[Math.abs(x)<.5?x:0,Math.abs(y)<.5?y:0]}
 let dx=x-r[0],dy=y-r[1];const m=Math.hypot(dx,dy);if(m<DZ){if(m<.12){r[0]+=(x-r[0])*.02;r[1]+=(y-r[1])*.02}return[0,0]}const k=Math.min(1,(m-DZ)/(1-DZ))/m;return[dx*k,dy*k]}
function pollPads(){let gp=[];try{gp=navigator.getGamepads?[...navigator.getGamepads()]:[]}catch(e){}
 for(let i=0;i<4;i++){const g=gp[i];if(!g||!g.connected||g.buttons.length<10||g.axes.length<2){padNow[i]=null;padRest[i]=null;continue}const b=g.buttons.map(x=>!!(x&&(x.pressed||x.value>.5))),[ax,ay]=stick(i,g.axes[0]||0,g.axes[1]||0);
  const sd=Math.abs(ax)>Math.abs(ay)?(ax>.6?"r":ax<-.6?"l":""):(ay>.6?"d":ay<-.6?"u":"");
  padNow[i]={b,ax,ay,pr:b.map((v,j)=>v&&!padPrev[i][j]),se:sd&&sd!==stickPrev[i]?sd:""};padPrev[i]=b;stickPrev[i]=sd;if(padNow[i].pr.some(Boolean))ensureAudio()}}

const rbWorkers=()=>{const g=villagers.filter(v=>v.g&&!v.ko);return g.length?g:villagers.filter(v=>!v.t&&!v.g&&!v.ko).slice(0,2)};
function rbTargets(){const a=[];if(cl("wall"))for(const q of segs()){if(q.gate)continue;const f=wsOf(q.i);if(f<1)a.push({k:"w"+q.i,i:q.i,w:1,f,x:q.ix,y:q.iy})}
 if(cl("tow"))towers().forEach(t=>{const f=G.th[t.i];if(f<1)a.push({k:"t"+t.i,i:t.i,w:0,f,x:cpX+(t.x-cpX)*.84,y:cpY+(t.y-cpY)*.84})});return a}
function rebuildTick(dt){if(G.inv||G.wact){G.rbOn=0;return}const L=rbTargets();
 if(!L.length){if(G.rbOn){G.rbOn=0;showBanner("CIDADE RECONSTRUÍDA");sfx("lvl");say("Os guardas terminaram de reconstruir a muralha e as torres!");saveDirty=1}return}
 if(!G.rbOn){G.rbOn=1;const D=L.reduce((a,q)=>a+(1-q.f)*(q.w?1:2),0),N=Math.max(1,rbWorkers().length);G.rbRate=Math.max(1/30,D/(N*420));say("Os guardas pegaram os martelos e começaram a reconstruir a cidade.")}}
function repWork2(v,dt){const L=rbTargets();if(!L.length){v.ham=0;return}
 let q=v.rbK&&L.find(o=>o.k===v.rbK);if(!q){const taken=new Set(villagers.filter(o=>o!==v&&o.rbK).map(o=>o.rbK));q=L.filter(o=>!taken.has(o.k)).sort((a,b)=>a.f-b.f)[0]||L.sort((a,b)=>a.f-b.f)[0];v.rbK=q.k}
 if(Math.hypot(v.x-q.x,v.y-q.y)>16){v.ham=1;walkTo(v,q.x,q.y,75*dt);return}
 v.ham=2;v.wx=v.wy=0;v.fl=q.x>cpX?0:1;v.hamT=(v.hamT||0)+dt;
 if(v.hamT>.5){v.hamT=0;const sx=v.x+(v.fl?-20:20),sy=v.y-6;for(let i=0;i<5;i++)burst(sx,sy,pk(["#ffd84a","#ffffff","#c8a050","#8a7a60"]),3,.35,(R()-.5)*90,-30-R()*60);hamSnd(sx,sy)}
 if(NET.mode==="client")return;const r=(G.rbRate||1/30)*dt;if(q.w)G.ws[q.i]=Math.min(1,G.ws[q.i]+r);else G.th[q.i]=Math.min(1,G.th[q.i]+r/2);
 if((q.w?G.ws[q.i]:G.th[q.i])>=1){v.rbK=null;ctKey=-1;saveDirty=1}}
function repWork(v,dt){let s=null,w=2;for(const q of segs()){if(q.gate)continue;const f=wsOf(q.i);if(f<w){w=f;s=q}}const tw=towers().find(t=>G.th[t.i]<1);
 const tx=s&&w<1?s.ix:tw?cpX+(tw.x-cpX)*.8:cpX-60,ty=s&&w<1?s.iy:tw?cpY+(tw.y-cpY)*.8:cpY;
 if(Math.hypot(v.x-tx,v.y-ty)>14){walkTo(v,tx,ty,80*dt);return}v.wx=v.wy=0;v.fl=tx>cpX?0:1;v.atkT=(v.atkT||0)-dt;if(v.atkT<=-.3){v.atkT=.25;burst(v.x+(v.fl?-14:14),v.y-14,pk(["#ffd84a","#ffffff","#c8a050"]),3,.3,(R()-.5)*80,-60);if(R()<.5)sfx("swing")}}
/* dano em estrutura (segmento da muralha ou torre) */
let wallMsgT=0;
function hitStruct(m,s){const dm=m.dm*(m.boss2?1.5:1)*INV_DMG;
 if(s.str==="w"){const mx=segMax(),f=wsOf(s.i);if(f<=0)return;const nd=dm*(1-wallRes());G.ws[s.i]=Math.max(0,f-nd/mx);if(R()<.4)burst(s.x,s.y-14,MATS[cl("wall")].top,3,.4,(R()-.5)*80,-40);
  if(G.ws[s.i]<=0){shake=Math.max(shake,6);for(let k=0;k<16;k++)burst(s.x,s.y-12,pk([MATS[cl("wall")].c,MATS[cl("wall")].top]),4,.8,(R()-.5)*160,-R()*120);if(time>wallMsgT){wallMsgT=time+8;say("A muralha foi rompida! Os invasores abriram um buraco.")}sfx("stomp")}}
 else{const mx=towMax(),f=G.th[s.i]||0;if(f<=0)return;G.th[s.i]=Math.max(0,f-dm*(1-wallRes()*.8)/mx);if(G.th[s.i]<=0){shake=Math.max(shake,8);for(let k=0;k<20;k++)burst(s.x,s.y-30,pk(["#8a8478","#5a3a1e","#ff8a1f"]),4,.9,(R()-.5)*180,-R()*140);say("Uma torre de defesa caiu!");sfx("stomp")}}}
function invHitDefender(m,v){m.st2=0;m.bd2=undefined;if(m.ccd>0)return;voice(m.t,"atk",m.x,m.y);if(v.str){m.ccd=.85;m.atkT=.25;hitStruct(m,v);return}m.ccd=.85;m.atkT=.25;v.hp-=m.dm*(m.boss2?1.5:1)*INV_DMG*(cl("wall")>=10?.85:1);num(v.x,v.y-30,Math.round(m.dm),"#ffb08a");
 if(v.hp<=0){v.ko=1;v.hp=0;for(let i=0;i<12;i++)burst(v.x,v.y-6,"#cfd8e8",3,.6,(R()-.5)*120,(R()-.5)*120);if(!villagers.some(q=>!q.ko))say("Todos os defensores caíram! Os invasores vão atacar o cristal!")}}
/* torres fazem parte da muralha; em cima delas ficam atiradores (moradores que atacam à distância, ou slimes arqueiros) */
/* 6 torres: 2 em cada portão (oeste e leste), uma ao norte e uma ao sul; cada nível até o 6 põe mais uma */
const TOW_A=[Math.PI-.42,-Math.PI+.42,.42,-.42,-Math.PI/2,Math.PI/2];
const towerN=()=>Math.min(6,cl("tow"));
const towMax=()=>Math.round((300+sumTop()*20)*(1+.25*cl("tow"))*(cl("tow")>=7?2:1)*(1+.1*cl("wall")));
/* tipo de cada torre: 0 flecha, 1 gelo (nv4), 2 canhão (nv6), 3 raio (nv8) */
const towerType=i=>{const l=cl("tow"),t=i%4;return t===1&&l>=4?1:t===2&&l>=6?2:t===3&&l>=8?3:0};
const RANGED=[15,12,2,5,4,3,19];
const towers=()=>{if(!G.th||G.th.length!==6)G.th=[1,1,1,1,1,1];return TOW_A.slice(0,towerN()).map((a,i)=>({str:"t",i,x:cpX+Math.cos(a)*WALL_RX*T,y:cpY+Math.sin(a)*WALL_RY*T,ox:cpX+Math.cos(a)*1.14*WALL_RX*T,oy:cpY+Math.sin(a)*1.14*WALL_RY*T,dead:G.th[i]<=0}))};
const towerShooter=i=>{const own=RANGED.filter(t=>PL.some(p=>p.own[t]));return own.length?own[i%own.length]:0};
function updTowers(dt){const ts=towers(),l=cl("tow"),st=l>=3,rg=(st?360:300)+Math.max(0,l-3)*12,tm=1+(l>=5?.25:0)+(l>=9?.25:0);
 ts.forEach((t,i)=>{if(t.dead)return;G.tw[i]=(G.tw[i]||0)-dt;if(G.tw[i]>0)return;const sh=towerShooter(i),lv=sh?Math.max(...PL.map(p=>p.own[sh]?p.slv[sh]:1)):sumTop(),dm=(6+lv*1.2)*(1+.12*l)*tm,ty2=towerType(i);
  const tx=t.x,ty=t.y-60;let b=null,bd=rg;for(const m of mons){if(!cityThreat(m))continue;const d=Math.hypot(m.x-tx,m.y-ty);if(d<bd){bd=d;b=m}}
  if(!b){G.tw[i]=.3;return}
  if(ty2===3){/* raio: corrente em 3 */let from={x:tx,y:ty};const hit=new Set();let cur=b;for(let j=0;j<3&&cur;j++){hit.add(cur);bolts.push({pts:zig(from,cur),t:.2,m:.2});hurt(cur,dm*(j?.7:1),0,ER,null);from=cur;let nb=null,nd=140;for(const m of mons){if(!m.inv||hit.has(m))continue;const dd=Math.hypot(m.x-cur.x,m.y-cur.y);if(dd<nd){nd=dd;nb=m}}cur=nb}sfx("bolt");G.tw[i]=1.1;return}
  if(ty2===2){/* canhão: explode em área */allyZ.push({x:b.x,y:b.y,R:60,warn:.5,age:0,t:.8,d:dm*1.3,el:EF,src:null,fired:0,tick:0});shots.push({x:tx,y:ty,dx:(b.x-tx)/(bd||1),dy:(b.y-ty)/(bd||1),t:.5,d:0,kd:"rock"});G.tw[i]=1.6;return}
  const kd=ty2===1?"ice":sh===15?"fireball":sh===12?"rock":sh===5?"acid":"arrow";shots.push({x:tx,y:ty,dx:(b.x-tx)/(bd||1),dy:(b.y-ty)/(bd||1),t:1.4,d:dm,kd,eff:ty2===1?2:undefined,el:ty2===1?EG:undefined});G.tw[i]=st?.6:.8});
 /* meteoro (nível 10): no maior grupo de invasores */
 if(l>=10){G.met=(G.met??25)-dt;if(G.met<=0){G.met=25;let best=null,bn=0;for(const m of mons){if(!m.inv)continue;let n=0;for(const q of mons)if(q.inv&&Math.hypot(q.x-m.x,q.y-m.y)<100)n++;if(n>bn){bn=n;best=m}}
  if(best){allyZ.push({x:best.x,y:best.y,R:110,warn:1,age:0,t:1.4,d:(40+sumTop()*8)*SMITH_M[cl("smith")],el:EF,src:null,fired:0,tick:0});say("As torres chamaram um meteoro!")}}}}
/* efeitos das construções durante a invasão (quem hospeda) */
function cityEffects(dt){const wl=cl("wall"),ml=mo(),tl=cl("heal"),deep=ml>=10?2:1;
 /* anti-travamento: invasor que não se aproxima do cristal por 20s (fora da muralha) é levado até a ponte */
 for(const m of mons){if(!m.inv||m.fly)continue;const d=Math.hypot(m.x-cpX,m.y-cpY);if(m.bd2===undefined||d<m.bd2-20){m.bd2=d;m.st2=0}else{m.st2=(m.st2||0)+dt;if(m.st2>20&&wallD(m.x,m.y)>1.1){const g=gateFor(m.x);m.x=g.ox+g.s*30;m.y=g.oy+(R()-.5)*30;m.st2=0;m.bd2=undefined}else if(m.st2>40){const g=gateFor(m.x);m.x=g.ix;m.y=g.iy;m.st2=0;m.bd2=undefined}}}
 /* espinhos no portão (muralha 5) e armadilhas na ponte (fosso 5 e 8) */
 if(wl>=5||ml>=5)for(const m of mons){if(!m.inv||m.fly)continue;if(isGate(m.x,m.y)&&wallD(m.x,m.y)>.85&&wallD(m.x,m.y)<1.5){m.trapT=(m.trapT||0)-dt;if(m.trapT<=0){m.trapT=.5;const d=(5+sumTop()*1.2)*((wl>=5?1:0)+(ml>=5?deep:0));hurt(m,d,ml>=8?2:0,null,null)}}}
 /* óleo fervente no portão (fosso 7) */
 if(ml>=7){G.oil=(G.oil??6)-dt;if(G.oil<=0){G.oil=6;for(const g of CGATES())if(mons.some(m=>m.inv&&Math.hypot(m.x-g.ox,m.y-g.oy)<160))allyZ.push({x:(g.ox+g.ix)/2,y:cpY,R:120,warn:.4,age:0,t:3,d:(20+sumTop()*3)*deep,el:EF,col:"#3a2a10",src:null,fired:0,tick:0})}}

 /* reparo (muralha 8): cristal se regenera entre as ondas */
 if(wl>=8&&G.iwT>0)G.vhp=Math.min(vmax(),G.vhp+vmax()*.02*dt);
 /* pulso do cristal (templo 9) */
 if(tl>=9){G.pulse=(G.pulse??6)-dt;if(G.pulse<=0){G.pulse=6;let any=0;for(const m of mons)if(m.inv&&Math.hypot(m.x-cpX,m.y-cpY)<140){any=1;const ex=m.x-cpX,ey=m.y-cpY,r=Math.hypot(ex,ey)||1;knock(m,ex/r*50,ey/r*50);hurt(m,15+sumTop()*2.5,0,null,null)}if(any)rings.push({x:cpX,y:cpY,r0:10,r1:140,t:.4,m:.4,c:"#bff4ff"})}}
 /* explosão de luz (templo 10): uma vez por invasão, com o cristal abaixo de 25% */
 if(tl>=10&&!G.lightUsed&&G.vhp<vmax()*.25){G.lightUsed=1;G.vhp=Math.min(vmax(),G.vhp+vmax()*.3);flashes.push({x:cpX,y:cpY,r:400,c:"255,250,200",t:.6,m:.6});shake=12;for(const m of mons)if(m.inv&&Math.hypot(m.x-cpX,m.y-cpY)<300)hurt(m,(60+sumTop()*10)*SMITH_M[cl("smith")],0,null,null);say("O cristal explodiu em luz sagrada!")}
 /* clérigos (quartel 7): curam os defensores */
 if(cl("bar")>=7)for(const v of villagers)if(!v.ko&&v.mhp&&v.hp<v.mhp)v.hp=Math.min(v.mhp,v.hp+v.mhp*.03*dt)}
/* ---- invasões: 5 ondas, 10s entre elas, de todos os lados, com nível subindo até +10 acima do jogador mais forte ---- */
const topLv=()=>Math.max(...PL.map(p=>p.lv),...NET.remote.map(r=>r.l||1));
const waveLv=w=>clamp(topLv()-2+(w-1)*3,1,MAXLV+10);
/* invasões ficam mais fortes conforme a cidade passa do nível 3 (até 2,3x), para a cidade sempre poder cair sem o jogador */
const cityPow=()=>{const s=G.vup.reduce((a,b)=>a+(b|0),0);return 1+1.6*Math.max(0,s-21)/49};
function waveSize(w){return Math.min(40,6+w*3+Math.min(10,G.ninv*2)+Math.round((cityPow()-1)*6))}
function spawnWaveMon(t,el,lv){for(let k=0;k<30;k++){const a=R()*6.283,r=(20+R()*4)*T,x=cpX+Math.cos(a)*r*1.1,y=cpY+Math.sin(a)*r*.85;if(!solid(x,y,{fly:MT[t].fl})){const m=mkMon(MID++,t,x,y,el,lv);m.inv=1;const cp=cityPow();m.mhp=m.hp=Math.round(m.mhp*INV_HP*cp);m.dm*=Math.pow(cp,.8);return m}}return spawnInvader(t,el)}
function startInvWave(){const I=INVS[G.ig||0],w=G.iw;G.spawnLeft=waveSize(w);G.st=0;G.iwT=0;G.bossOut=0;showBanner("ONDA "+w+" DE "+INV_WAVES+(w===INV_WAVES?" · CHEFE!":""));sfx("wave");
 say((w===1?"A "+I.n+" ataca "+cityName()+" por todos os lados! ":"")+"Onda "+w+"/"+INV_WAVES+": monstros de nível "+waveLv(w)+(w>=3?", com voadores":"")+(w===INV_WAVES?" e o chefe da horda!":"."))}

function endInvasion(){const g=Math.round((60+G.ninv*15)*GOLD_M[cl("house")]);G.cr+=g;G.wact=0;G.inv=0;G.iw=0;G.ninv++;G.it=INV_EVERY;G.warned=0;reviveDefenders();showBanner("INVASÃO REPELIDA!");say("A cidade resistiu às 5 ondas! +"+g+" ouro. Próxima invasão em 15 minutos.");saveDirty=1}
function spawnTick(){const I=INVS[G.ig||0],w=G.iw,lv=waveLv(w);
 if(w===INV_WAVES&&!G.bossOut){G.bossOut=1;const b=spawnWaveMon(I.b,1,Math.min(MAXLV+10,lv));b.boss2=1;b.mhp=b.hp=Math.round(b.mhp*6);b.dm*=1.6;say("O chefe da "+I.n+" chegou: "+MT[I.b].n+" gigante!");sfx("roar");shake=10}
 const r=R(),pool=w>=3&&r<.22?I.f:r<.62?I.m:I.r;spawnWaveMon(pk(pool),R()<.1?1:0,lv)}
/* conserto da muralha e das torres: paga em ouro e um guarda reconstrói por 20s, só fora de batalha */
const dmgFrac=()=>{let s=0;if(cl("wall"))for(const q of segs())if(!q.gate)s+=1-wsOf(q.i);towers().forEach(t=>s+=2*(1-G.th[t.i]));return s};
const repCost=()=>{const f=dmgFrac();return f<.02?0:Math.max(10,Math.round(f*(10+cl("wall")*8+cl("tow")*2)))};
const repWorker=()=>villagers.find(v=>v.g&&!v.ko)||villagers.find(v=>!v.ko);

function cityTick(dt){if(G.ch<2)return;applyCityTiles();syncGuards();styleSlimes();if(cl("tow"))updTowers(dt);rebuildTick(dt);
 if(cl("heal")>=3&&!G.wact)G.vhp=Math.min(vmax(),G.vhp+5*dt);if(G.inv)cityEffects(dt);
 if(G.wave<5)return;/* a missão das 4 ondas ainda não acabou */

 /* v3.3: as invasões só começam quando algum jogador chega ao nível 30 */

 if(!G.inv&&!G.inv30){G.inv30=1;say("Sua fama cresceu: a partir de agora "+cityName()+" sofre invasões a cada 15 minutos!");showBanner("INVASÕES COMEÇARAM")}
 if(!G.inv){G.it=(G.it??INV_EVERY)-dt;if(G.it<=INV_WARN&&!G.warned){G.warned=1;G.ig=Math.floor(R()*INVS.length);showBanner("INVASÃO EM 1 MINUTO!");say("Batedores avistaram a "+INVS[G.ig].n+"! Ela chega em 1 minuto, por todos os lados. Prepare a defesa.");sfx("warn")}
  if(G.it<=0)startInvasion();return}

 else if(!mons.some(m=>m.inv)){if(G.iw>=INV_WAVES)endInvasion();else if(!G.iwT){G.iwT=WAVE_GAP;/* quem caiu na onda só volta agora, entre uma onda e outra */const kd=villagers.filter(v=>v.ko).length;reviveDefenders();if(kd)say(kd+" defensores caídos voltaram para a próxima onda.");const j=cl("house")>=5?Math.round(G.cr*.03):0;G.cr+=j;say("Onda "+G.iw+" vencida! A próxima chega em 10 segundos."+(j?" Juros: +"+j+" ouro.":""))}else{G.iwT-=dt;if(G.iwT<=0){G.iw++;startInvWave()}}}
 if(G.vhp<=0){const lost=Math.floor(G.cr*.25);G.cr-=lost;villageFall();G.inv=0;G.wact=0;G.iw=0;G.it=INV_EVERY;G.warned=0;reviveDefenders();say("O cristal foi destruído e a cidade perdeu "+lost+" de ouro… o cristal se refez, mas a muralha precisa de conserto. Próxima invasão em 15 minutos.")}}

function touchAt(x,y){if(Math.hypot(x-TJ.cx,y-TJ.cy)<108&&x<VW/2)return"joy";for(const b of TB)if(Math.hypot(x-b.x,y-b.y)<b.r+8)return b.k;return null}
