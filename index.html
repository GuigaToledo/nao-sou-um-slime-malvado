 if(up){const s=p.su;if(s&&s.t===t){const r=s.hp/s.mhp;s.mhp=sumHP(p,t);s.hp=s.dead>0?s.hp:Math.max(s.hp,s.mhp*r);pillars.push({x:s.x,y:s.y,t:1.2,m:1.2,tg:s,txt:"NÍVEL "+p.slv[t]})}sfx("newform");say(MT[t].n+" de "+pn(p).replace("Você","você")+" subiu para o nível "+p.slv[t]+"!");saveDirty=1}}
function gain(p,x){sumGain(p,x);p.xp+=x;while(p.xp>=need(p)){p.xp-=need(p);p.lv++;p.sp++;p.hp=mhp(p);sfx("lvl");pillars.push({x:p.x,y:p.y,t:1.4,m:1.4,tg:p});
 say(pn(p)+" chegou ao nível "+p.lv+"! +1 ponto de habilidade ["+kn(p,"tree")+"]");saveDirty=1}}
function herb(p,i){const q=plants[i];plants.splice(i,1);p.hp=Math.min(mhp(p),p.hp+20);gain(p,5);num(q.x,q.y-20,"+20","#7aff7a");sfx("devour");
 for(let k=0;k<10;k++)burst(q.x,q.y-6,"#7aff7a",3,.8,(R()-.5)*60,(R()-.5)*60,p);if(!p.reg){p.reg=1;say(pn(p)+" devorou uma erva e ganhou “Regeneração”.")}}
function hitCrack(x,y,a){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(map[ty]?.[tx]!==10)return;const k=ty*MW+tx;crack[k]=(crack[k]??3)-a;
 for(let i=0;i<8;i++)burst(tx*T+16,ty*T+20,pk(["#8693ad","#465169","#c8d0e0"]),4,.5,(R()-.5)*120,-R()*90,null,260);sfx("crack");shake=Math.max(shake,3);
 if(crack[k]<=0){map[ty][tx]=0;mmTile(tx,ty);say("Sábio: uma passagem secreta!")}}
function stompCrack(x,y,r){const cx=Math.floor(x/T),cy=Math.floor(y/T);for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(map[cy+j]?.[cx+i]===10)hitCrack((cx+i)*T+16,(cy+j)*T+16,3)}
function openChest(tx,ty){const i=secrets.findIndex(s=>s.x===tx&&s.y===ty);map[ty][tx]=12;mmTile(tx,ty);sfx("chest");
 for(let k=0;k<30;k++)burst(tx*T+16,ty*T+10,pk(["#ffe14a","#fff","#e8c25a"]),4,1,(R()-.5)*160,-R()*160,null,200);
 if(i<0)return;const b=1<<i;for(const p of PL)if(!(p.sec&b)){p.sec|=b;grantSkin(p)}saveDirty=1}
/* baús e chefes dão um visual novo para o slime */
function grantSkin(p){const free=[];for(let i=0;i<NSKIN;i++)if(!p.skins[i])free.push(i);
 if(!free.length){p.sp++;say(pn(p)+" já tem todos os visuais! Ganhou +1 ponto de habilidade.");return}
 const i=pk(free);p.skins[i]=1;sfx("chest");pillars.push({x:p.x,y:p.y,t:1.4,m:1.4,tg:p,txt:"VISUAL NOVO!"});
 let n=0;for(let k=0;k<NSKIN;k++)n+=p.skins[k];say(pn(p)+" ganhou o visual “"+SKINS[i].n+"” ("+n+"/"+NSKIN+")! Vista em ["+kn(p,"tree")+"] › Visual.");saveDirty=1}
function attack(p){p.cd=.4;p.af=.15;p.aseq++;sfx("swing");const cr=R()<critC(p),d=mdmg(p)*(cr?2:1),a0=Math.atan2(p.fy,p.fx);
 for(let k=-3;k<=3;k++)burst(p.x+Math.cos(a0+k*.28)*24,p.y-6+Math.sin(a0+k*.28)*24,p.form===0?PCOL[p.col]:"#fff",4,.14);
 for(const m of monsIn(p.x,p.y,64)){const ex=m.x-p.x,ey=m.y-p.y,r=Math.hypot(ex,ey)||1;if(r<(MT[m.t].boss?62:MT[m.t].drg?58:46)&&(ex*p.fx+ey*p.fy)>-8){knock(m,ex/r*12,ey/r*12);hurt(m,d*(.85+R()*.3),0,null,p,cr)}}
 hitCrack(p.x+p.fx*30,p.y+p.fy*30,1)}
const inCone=(s,m,r)=>{const ex=m.x-s.x,ey=m.y-s.y,d=Math.hypot(ex,ey)||1;return d<r&&(ex*s.fx+ey*s.fy)/d>.6};

 if(k==="arc"){shots.push({x:s.x,y:s.y-6,dx:s.fx,dy:s.fy,t:1.1,d,kd:s.ft===5?"acid":s.ft===12||s.ft===23?"rock":"spear",src,cr});sfx("shoot")}
 else if(k==="fireball"){shots.push({x:s.x,y:s.y-6,dx:s.fx,dy:s.fy,t:1.2,d:d*1.2,kd:"fireball",src,cr});sfx("shoot")}
 else if(k==="bolt"){const px=-s.fy,py=s.fx,pts=[[s.x,s.y-8]];for(let i=1;i<=9;i++){const j=(R()-.5)*18;pts.push([s.x+s.fx*i*20+px*j,s.y-8+s.fy*i*20+py*j])}bolts.push({pts,t:.2,m:.2});
  flashes.push({x:s.x+s.fx*90,y:s.y+s.fy*90,r:180,c:"255,240,120",t:.2,m:.2});sfx("bolt");
  for(const m of monsIn(s.x,s.y,190)){const ex=m.x-s.x,ey=m.y-s.y,a=ex*s.fx+ey*s.fy,b=Math.abs(ex*s.fy-ey*s.fx);if(a>0&&a<180&&b<20)H(m,d*1.3,0)}}
 else if(k==="storm"){sfx("bolt");shake=Math.max(shake,5);const ts=monsIn(s.x,s.y,230).sort(()=>R()-.5).slice(0,4);for(const m of ts){const pts=[[m.x+(R()-.5)*30,m.y-260]];for(let i=1;i<=7;i++)pts.push([m.x+(R()-.5)*26,m.y-260+i*37]);bolts.push({pts,t:.25,m:.25});flashes.push({x:m.x,y:m.y,r:120,c:"200,230,255",t:.25,m:.25});H(m,d*1.6,0)}}
 else if(k==="web"){rings.push({x:s.x,y:s.y,r0:10,r1:95,t:.4,m:.4,c:"#ffffff"});sfx("web");for(const m of monsIn(s.x,s.y,95))hurt(m,0,1,null,src)}
 else if(k==="cloud")clouds.push({x:s.x,y:s.y,t:4,h:0,d:d*.25,src});
 else if(k==="fire"){spray(s,["#ff8a1f","#ffd84a","#ff4a1a"],320,26);flashes.push({x:s.x+s.fx*60,y:s.y+s.fy*60,r:200,c:"255,140,40",t:.4,m:.4});shake=Math.max(shake,2);sfx("fire");for(const m of monsIn(s.x,s.y,120))if(inCone(s,m,120))H(m,d,3)}
 else if(k==="frost"){spray(s,["#9fe8f5","#ffffff","#5ab8e0"],300,24);flashes.push({x:s.x+s.fx*60,y:s.y+s.fy*60,r:150,c:"140,220,255",t:.35,m:.35});sfx("frost");for(const m of monsIn(s.x,s.y,120))if(inCone(s,m,120))H(m,d*.8,2)}
 else if(k==="stomp"){rings.push({x:s.x,y:s.y,r0:8,r1:80,t:.35,m:.35,c:"#d8b070"});shake=Math.max(shake,7);sfx("stomp");for(let i=0;i<16;i++)burst(s.x+(R()-.5)*60,s.y+(R()-.5)*30,pk(["#8a7a60","#b0a080"]),4,.5,(R()-.5)*100,-R()*90,null,240);for(const m of monsIn(s.x,s.y,80))H(m,d*1.2,4);stompCrack(s.x,s.y,2)}
 else if(k==="charge"){if(s.slot!==undefined){/* no jogador, a investida vira um golpe de chifre no lugar: ele nunca anda sozinho */
   spray(s,["#c89a6a","#efe2c0","#8a5a2e"],280,18);shake=Math.max(shake,4);sfx("stomp");for(const m of monsIn(s.x,s.y,100))if(inCone(s,m,100)){knock(m,s.fx*24,s.fy*24);H(m,d*1.5,4)}}
  else{s.dash=.22;s.hs=new Set();shake=Math.max(shake,3)}}
 else if(k==="gaze"){spray(s,["#ffe14a","#ffffff"],260,16);flashes.push({x:s.x+s.fx*60,y:s.y+s.fy*60,r:160,c:"255,230,100",t:.3,m:.3});for(const m of monsIn(s.x,s.y,130))if(inCone(s,m,130))H(m,d*.5,1)}
 else if(k==="tornado"){torn.push({x:s.x,y:s.y,dx:s.fx,dy:s.fy,t:2.2,h:0,d,src});sfx("frost")}
 else if(k==="spin"){rings.push({x:s.x,y:s.y,r0:10,r1:72,t:.3,m:.3,c:"#e0e6ee"});sfx("swing");for(let i=0;i<14;i++){const a=i/14*6.283;burst(s.x+Math.cos(a)*40,s.y-6+Math.sin(a)*26,"#e0e6ee",4,.25,Math.cos(a)*120,Math.sin(a)*80)}
  for(const m of monsIn(s.x,s.y,72)){const ex=m.x-s.x,ey=m.y-s.y,r=Math.hypot(ex,ey)||1;knock(m,ex/r*18,ey/r*18);H(m,d*1.3,0)}}
 else if(k==="blink"&&s.slot!==undefined){const g=tg||{x:s.x+s.fx*90,y:s.y+s.fy*90};for(let i=0;i<18;i++)burst(g.x+(R()-.5)*30,g.y-8+(R()-.5)*30,pk(["#b48aff","#ff4aff","#3a2a4a"]),4,.45,(R()-.5)*100,(R()-.5)*100);sfx("web");
  rings.push({x:g.x,y:g.y,r0:6,r1:46,t:.3,m:.3,c:"#b48aff"});for(const m of monsIn(g.x,g.y,46))H(m,d*1.6,0)}
 else if(k==="blink"){const g=tg||{x:s.x+s.fx*120,y:s.y+s.fy*120},ex=g.x-s.x,ey=g.y-s.y,r=Math.hypot(ex,ey)||1,n=Math.max(0,r-22);for(let i=0;i<12;i++)burst(s.x+(R()-.5)*20,s.y-8+(R()-.5)*20,pk(["#b48aff","#3a2a4a"]),4,.4,(R()-.5)*60,(R()-.5)*60);
  for(let i=0;i<n;i+=8)mv(s,ex/r*8,ey/r*8);for(let i=0;i<12;i++)burst(s.x+(R()-.5)*20,s.y-8+(R()-.5)*20,pk(["#b48aff","#ff4aff"]),4,.4,(R()-.5)*90,(R()-.5)*90);sfx("web");
  for(const m of monsIn(s.x,s.y,46))H(m,d*1.6,0)}}
function doDash(s,dt,d,src){if(s.dash<=0)return;s.dash-=dt;mv(s,s.fx*470*dt,s.fy*470*dt);burst(s.x,s.y,"#c89a6a",5,.3,(R()-.5)*40,-R()*30);
 for(const m of monsIn(s.x,s.y,30))if(!s.hs.has(m)){s.hs.add(m);knock(m,s.fx*20,s.fy*20);hurt(m,d,0,null,src)}}
function cycleForm(p,d){const l=formList(p);if(l.length<2){if(!hints.f){hints.f=1;say("Derrote monstros: cada um devorado vira uma forma nova.")}return}let i=l.indexOf(p.form);if(i<0)i=0;p.form=l[(i+d+l.length)%l.length];p.wf=d;p.scd=Math.max(p.scd,.3);sfx("ui");
 for(let k=0;k<14;k++)burst(p.x,p.y-8,pk(["#b48aff","#fff"]),3,.4,(R()-.5)*160,(R()-.5)*160);num(p.x,p.y-46,MT[p.form].n,"#d0b8ff")}
function cycleSum(p,d){const l=sumList(p);if(l.length<2){if(!hints.s){hints.s=1;say("Derrote monstros para poder invocá-los como aliados.")}return}let i=l.indexOf(p.sum);if(i<0)i=0;p.sum=l[(i+d+l.length)%l.length];p.ws=d;p.su=null;sfx(p.sum>0?"summon":"ui")}
function healSpell(p){if(p.hcd>0){num(p.x,p.y-40,"Cura em "+Math.ceil(p.hcd)+"s","#a8ffb8");return}p.hcd=healCD(p);const a=Math.round(mhp(p)*.25*(S(p,"mag1")?1.5:1));sfx("heal");
 const doHeal=(e,mx)=>{e.hp=Math.min(mx,e.hp+a);num(e.x,e.y-36,"+"+a,"#7aff7a",1);for(let i=0;i<16;i++)burst(e.x+(R()-.5)*30,e.y+6,pk(["#7aff7a","#d8ffd8","#ffffff"]),3,.9,(R()-.5)*20,-60-R()*80);rings.push({x:e.x,y:e.y+8,r0:4,r1:40,t:.5,m:.5,c:"#7aff7a"})};
 doHeal(p,mhp(p));if(S(p,"mag7"))p.bless=4;
 if(S(p,"mag3")){for(const q of PL)if(q!==p&&q.dead<=0&&Math.hypot(q.x-p.x,q.y-p.y)<160)doHeal(q,mhp(q));for(const q of PL)if(q.su&&q.su.dead<=0&&Math.hypot(q.su.x-p.x,q.su.y-p.y)<160)doHeal(q.su,q.su.mhp)}}
function die(p){p.dead=S(p,"mag8")?2:4;p.hp=0;p.pz=0;p.dash=0;p.dsh=0;for(let i=0;i<20;i++)burst(p.x,p.y-8,PCOL[p.col],4,.8,(R()-.5)*160,(R()-.5)*160,null,200);say(pn(p)+" foi derrotado… a gosma se junta de novo em "+p.dead+"s.");sfx("hurt")}
function respawn(p){const al=PL.find(q=>q!==p&&q.dead<=0);if(al){p.x=al.x;p.y=al.y}else{[p.x,p.y]=spawnPoint()}p.hp=mhp(p);p.su=null;if(S(p,"mag8"))p.inv=3}
function canInteract(p){return(Math.hypot(p.x-vXp,p.y-vYp)<120&&!p.own[DRG])||(G.ch>=2&&Math.hypot(p.x-elder.x,p.y-elder.y)<80)}
function interact(p){
 if(Math.hypot(p.x-vXp,p.y-vYp)<120){
  if(p.own[DRG]){say("O Dragão do Vendaval já é seu amigo. Invoque-o na roda de invocação.");return}
  if(p.lv<5){say("Dragão: “Kuahaha! Uma gosminha? Volte quando tiver Nível 5 e conversaremos.”");sfx("roar");return}
  p.own[DRG]=1;p.res|=1<<ER;p.sum=DRG;p.su=null;p.ws=1;shake=12;sfx("dragon");
  for(let i=0;i<70;i++)burst(vXp+(R()-.5)*120,vYp-20+(R()-.5)*90,pk(["#ffe14a","#bff4ff","#5ad8ff"]),5,1.6,(R()-.5)*200,(R()-.5)*200,p);
  rings.push({x:vXp,y:vYp,r0:150,r1:4,t:.7,m:.7,c:"#ffe14a"});
  if(G.phase<1){if(NET.mode==="client")netHit(-1,0,99);else setPhase(1)}
  gain(p,900);grantSkin(p);say("O Dragão do Vendaval aceitou sua amizade! Ele luta ao seu lado como invocação e você também pode se transformar nele. A passagem para o mundo aberto se abriu.");saveDirty=1;return}
 if(G.ch>=2&&Math.hypot(p.x-elder.x,p.y-elder.y)<80){if(NET.mode==="client"){say("Ancião: “Quem é o servidor cuida das melhorias da vila.”");return}state="upgrade";menuSel=0;sfx("ui");return}
 const v=villagers.find(q=>Math.hypot(q.x-p.x,q.y-p.y)<50);if(v&&G.ch>=2)say(pk(["Goblin: “Obrigado por proteger "+G.vname+"!”","Goblin: “Os orcs vêm do sul!”","Goblin: “Você não é um slime malvado, né?”"]))}
/* ===== Jogador ===== */
function updPlayer(p,dt,inp,ctl){p.hit-=dt;p.eatT-=dt;p.cast-=dt;
 const dec=v=>v-Math.sign(v)*Math.min(Math.abs(v),dt*7);p.wf=dec(p.wf);p.ws=dec(p.ws);
 if(p.dead>0){p.dead-=dt;if(p.dead<=0)respawn(p);return}
 const fm=MT[p.form];p.fly=!!fm.fl;p.sm=!!fm.sm;p.ft=p.form;
 p.slow-=dt;p.cd-=dt;p.af-=dt;p.dcd-=dt;p.imT-=dt;p.hcd-=dt;p.bless-=dt;p.scT-=dt;p.inv-=dt;p.scd-=dt;
 if(ctl){let dx=inp.mx,dy=inp.my;p.mv=Math.hypot(dx,dy)>.15;if(inp.runToggle)p.runT=!p.runT;if(!p.mv)p.runT=0;p.run=!!(inp.run||p.runT);
  if(p.mv){const l=Math.hypot(dx,dy)||1;p.fx=dx/l;p.fy=dy/l;if(Math.abs(dx)>.1)p.fl=dx<0;const s=100*fm.fs*dt*(p.slow>0?.5:1)*(p.run?1.6:1);let mx=dx*s,my=dy*s;
   if(PL.length>1){if((p.x+mx<camx+14&&mx<0)||(p.x+mx>camx+VW-14&&mx>0))mx=0;if((p.y+my<camy+24&&my<0)||(p.y+my>camy+VH-8&&my>0))my=0}mv(p,mx,my);
   if(p.run&&R()<.4)burst(p.x-p.fx*10,p.y+8,PCOL[p.col],3,.3,-p.fx*40,-R()*20)}
  if(inp.dash&&p.dcd<=0){p.dsh=S(p,"def7")?.26:.18;p.dcd=S(p,"def7")?.42:.7;sfx("dash");for(let i=0;i<10;i++)burst(p.x,p.y-6,pk([PCOL[p.col],"#ffffff"]),4,.35,(R()-.5)*120,(R()-.5)*120)}
  if(inp.fp)cycleForm(p,-1);if(inp.fn)cycleForm(p,1);if(inp.sp)cycleSum(p,-1);if(inp.sn)cycleSum(p,1);
  if(inp.act){if(canInteract(p)||villagers.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<50)){interact(p);inp.atk=0}else if(p.cd<=0)attack(p)}
  if(inp.heal)healSpell(p)}
 else{p.mv=0;p.run=0}
 if(p.dsh>0){p.dsh-=dt;mv(p,p.fx*430*dt,p.fy*430*dt);burst(p.x,p.y-4,PCOL[p.col],5,.25,(R()-.5)*30,(R()-.5)*30)}
 /* golpe de perto automático; segurar o botão de agir também golpeia (quebra paredes) */
 const n1=nearMon(p,44),man=ctl&&inp.atk;if(p.cd<=0&&(man||n1)){if(n1&&!man)face(p,n1);attack(p)}
 /* magia automática: a da forma atual; como slime, uma sorteada entre todas as aprendidas */
 if(p.scd<=0){let k=null,ft=p.form;if(fm.k)k=Array.isArray(fm.k)?fm.k[p.ki%fm.k.length]:fm.k;
  else{if(!p.rk){const pool=[];for(let i=1;i<NF;i++)if(p.own[i]&&MT[i].k)for(const q of(Array.isArray(MT[i].k)?MT[i].k:[MT[i].k]))pool.push([q,i]);if(pool.length)p.rk=pk(pool)}if(p.rk){k=p.rk[0];ft=p.rk[1]}}
  if(k){const tg=nearMon(p,KD[k][0]*(k==="charge"||k==="stomp"||k==="spin"||k==="web"||k==="cloud"?.8:1));if(tg||(ctl&&inp.skill&&fm.k)){if(tg)face(p,tg);const cr=R()<critC(p);p.ft=ft;
    cast(p,k,dmg(p)*(cr?2:1)*(fm.k?1:.8),tg,p,cr);p.ft=p.form;p.scd=KD[k][1]*(S(p,"atk4")?.85:1)*(fm.k?1:1.25);p.ki++;p.kk=KL.indexOf(k);p.kseq++;p.rk=null}}}
 doDash(p,dt,dmg(p)*2,p);
 const hi=plants.findIndex(q=>Math.abs(q.x-p.x)<26&&Math.hypot(q.x-p.x,q.y-p.y)<26);if(hi>=0)herb(p,hi);
 const tx=Math.floor(p.x/T),ty=Math.floor(p.y/T),tt=map[ty]?.[tx];
 if(tt===9&&p.sm){map[ty][tx]=0;mmTile(tx,ty)}
 if(tt===11)openChest(tx,ty);
 if(tt===6&&!p.fly&&!immune(p,EV)){p.hp-=dt*5;p.pz=2}
 if(tt===7&&!p.fly&&!immune(p,EF)){p.hp-=dt*14;if(R()<.2)burst(p.x+(R()-.5)*16,p.y,"#ff8a1f",3,.4,0,-40)}
 if(p.pz>0&&!immune(p,EV)){p.pz-=dt;p.hp-=dt*3}else p.pz=0;
 let rg=(p.reg?1.2:.25)+2*S(p,"def3")+3*S(p,"mag6");if(G.vup[2]&&G.ch>=2&&Math.hypot(p.x-cpX,p.y-cpY)<170)rg+=5;p.hp=Math.min(mhp(p),p.hp+dt*rg);
 for(let j=-7;j<=7;j++)for(let i=-10;i<=10;i++){const a=tx+i,b=ty+j;if(a>=0&&b>=0&&a<MW&&b<MH&&!seen[b*MW+a]){seen[b*MW+a]=1;mmTile(a,b)}}
