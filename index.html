 else if(k==="stomp"){rings.push({x:s.x,y:s.y,r0:8,r1:80,t:.35,m:.35,c:"#d8b070"});shake=Math.max(shake,7);sfx("stomp");for(let i=0;i<16;i++)burst(s.x+(R()-.5)*60,s.y+(R()-.5)*30,pk(["#8a7a60","#b0a080"]),4,.5,(R()-.5)*100,-R()*90,null,240);for(const m of [...mons])if(Math.hypot(m.x-s.x,m.y-s.y)<80)hurt(m,d*1.2,4);stompCrack(s.x,s.y,2)}
 else if(k==="charge"){s.dash=.22;s.hs=new Set();shake=Math.max(shake,3)}

  for(const m of [...mons]){const ex=m.x-s.x,ey=m.y-s.y,r=Math.hypot(ex,ey)||1;if(r<72){knock(m,ex/r*18,ey/r*18);hurt(m,d*1.3,0)}}}
 else if(k==="blink"&&tg){const ex=tg.x-s.x,ey=tg.y-s.y,r=Math.hypot(ex,ey)||1,n=Math.max(0,r-22);for(let i=0;i<12;i++)burst(s.x+(R()-.5)*20,s.y-8+(R()-.5)*20,pk(["#b48aff","#3a2a4a"]),4,.4,(R()-.5)*60,(R()-.5)*60);

function updPlayer(p,dt,inp,ctl){p.hit-=dt;p.eatT-=dt;
 const dec=v=>v-Math.sign(v)*Math.min(Math.abs(v),dt*7);p.wf=dec(p.wf);p.ws=dec(p.ws);
 if(p.dead>0){p.dead-=dt;if(p.dead<=0)respawn(p);return}
 const fm=MT[p.form];p.fly=!!fm.fl;p.sm=!!fm.sm;p.ft=p.form;
 if(ctl){let dx=inp.mx,dy=inp.my;p.mv=Math.hypot(dx,dy)>.15;
  if(p.mv){const l=Math.hypot(dx,dy)||1;p.fx=dx/l;p.fy=dy/l;if(Math.abs(dx)>.1)p.fl=dx<0;const s=95*fm.fs*dt*(p.slow>0?.5:1);let mx=dx*s,my=dy*s;
   if(PL.length>1){if((p.x+mx<camx+14&&mx<0)||(p.x+mx>camx+VW-14&&mx>0))mx=0;if((p.y+my<camy+24&&my<0)||(p.y+my>camy+VH-8&&my>0))my=0}mv(p,mx,my)}
  if(inp.fp)cycleForm(p,-1);if(inp.fn)cycleForm(p,1);if(inp.sp)cycleSum(p,-1);if(inp.sn)cycleSum(p,1);if(inp.int)interact(p)}
 else p.mv=0;
 p.slow-=dt;p.cd-=dt;p.af-=dt;
 const n1=nearMon(p,44),man=ctl&&inp.atk;if(p.cd<=0&&(man||n1)){if(n1&&!man)face(p,n1);attack(p)}
 if(fm.k){p.scd-=dt;const k=Array.isArray(fm.k)?fm.k[p.ki%fm.k.length]:fm.k,tg=p.scd<=0&&nearMon(p,KD[k][0]);
  if(tg){face(p,tg);cast(p,k,dmg(p),tg);p.scd=KD[k][1]*(p.form===DRG?.6:1);p.ki++;p.kk=KL.indexOf(k);p.kseq++}}
 doDash(p,dt,dmg(p)*2);
 const hi=plants.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<26);if(hi>=0)herb(p,hi);
 const tx=Math.floor(p.x/T),ty=Math.floor(p.y/T),tt=map[ty]?.[tx];
 if(tt===9&&p.sm){map[ty][tx]=0;mmDirty=1}
 if(tt===11)openChest(tx,ty);
 if(tt===6&&!p.fly&&p.form!==4){p.hp-=dt*4;if(!p.imm)p.pz=2}
 if(tt===7&&!p.fly&&p.form!==7){p.hp-=dt*12;if(R()<.2)burst(p.x+(R()-.5)*16,p.y,"#ff8a1f",3,.4,0,-40)}
 if(p.pz>0&&!p.imm){p.pz-=dt;p.hp-=dt*2.5}else p.pz=0;
 let rg=(p.reg?2:.3)+(has(p,4)?3:0);if(G.vup[2]&&G.ch>=2&&Math.hypot(p.x-cpX,p.y-cpY)<170)rg+=5;p.hp=Math.min(mhp(p),p.hp+dt*rg);
 for(let j=-7;j<=7;j++)for(let i=-9;i<=9;i++){const a=tx+i,b=ty+j;if(a>=0&&b>=0&&a<MW&&b<MH&&!seen[b*MW+a]){seen[b*MW+a]=1;mmDirty=1}}
 if(!hints.cr)for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++)if(map[ty+j]?.[tx+i]===10){hints.cr=1;say("Sábio: essa parede parece rachada… ataque-a com ["+(p.src.pad>=0?"A":"Espaço")+"].")}
 if(!hints.v&&Math.hypot(p.x-vXp,p.y-vYp)<160&&!p.own[DRG]){hints.v=1;say("Sábio: o Dragão Tempestade está selado aqui. Com Nível 5, aperte ["+(p.src.pad>=0?"X":"F")+"] para devorá-lo.")}
 if(p.hp<=0)die(p);
 updSummon(p,dt)}

function mkSum(p,t){const h=sumHP(p,t);return{t,ow:p,x:p.x-p.fx*30,y:p.y-p.fy*30,hp:h,mhp:h,cd:.5,scd:1.5,ki:0,fx:1,fy:0,fl:0,mv:0,dead:0,f:0,dash:0,hs:null,fly:!!MT[t].fl,sm:!!MT[t].sm,ft:t}}
function updSummon(p,dt){if(p.sum<1||!p.own[p.sum]){p.su=null;return}
 if(!p.su||p.su.t!==p.sum){p.su=mkSum(p,p.sum);for(let i=0;i<16;i++)burst(p.su.x,p.su.y-8,pk(["#b48aff","#fff",PCOL[p.col]]),3,.5,(R()-.5)*140,(R()-.5)*140)}
 const s=p.su;s.f-=dt;
 if(s.dead>0){s.dead-=dt;if(s.dead<=0){s.hp=s.mhp;s.x=p.x;s.y=p.y;sfx("summon")}return}
 let tg=null,bd=1e9;for(const m of mons){if(Math.hypot(m.x-p.x,m.y-p.y)>240)continue;const d=Math.hypot(m.x-s.x,m.y-s.y);if(d<bd){bd=d;tg=m}}
 const t=MT[s.t],sp=(t.sp||70)*1.2*dt;
 const gx=tg?tg.x:p.x-p.fx*36+(p.fy?18:0),gy=tg?tg.y:p.y-p.fy*36-(p.fx?8:0);
 const ex=gx-s.x,ey=gy-s.y,d=Math.hypot(ex,ey)||1;
 if(Math.hypot(p.x-s.x,p.y-s.y)>420){s.x=p.x;s.y=p.y}
 s.mv=d>(tg?22:16);if(s.mv){const st=Math.min(sp,d);mv(s,ex/d*st,ey/d*st)}
 if(Math.abs(ex)>2)s.fl=ex<0;if(tg){s.fx=ex/d;s.fy=ey/d}
 s.cd-=dt;s.scd-=dt;
 if(tg&&bd<30&&s.cd<=0){s.cd=.9;hurt(tg,sumDM(p,s.t)*(.8+R()*.4),0);for(let i=0;i<4;i++)burst((s.x+tg.x)/2,(s.y+tg.y)/2-6,PCOL[p.col],3,.2,(R()-.5)*120,(R()-.5)*120)}
 const k=t.k?(Array.isArray(t.k)?t.k[s.ki%t.k.length]:t.k):null;
 if(k&&tg&&s.scd<=0&&bd<KD[k][0]){cast(s,k,sumDM(p,s.t)*1.2,tg);s.scd=KD[k][1]*1.8;s.ki++}
 doDash(s,dt,sumDM(p,s.t)*1.5)}
function localEnts(){const a=[];for(const p of PL){if(p.dead>0)continue;a.push(p);if(p.su&&p.su.dead<=0)a.push(p.su)}return a}
function hurtEnt(e,d,ps){if(e.ow){e.hp-=d;e.f=.15;num(e.x,e.y-26,Math.round(d),"#ffb08a");if(e.hp<=0){e.dead=has(e.ow,8)?5:15;for(let i=0;i<14;i++)burst(e.x,e.y-8,"#b48aff",3,.6,(R()-.5)*140,(R()-.5)*140)}return}
 const p=e;if(p.dead>0)return;d*=has(p,5)?.8:1;p.hp-=d;p.hit=.2;shake=Math.max(shake,3);num(p.x,p.y-30,Math.round(d),"#ff5a5a");sfx("hurt");if(ps&&!p.imm)p.pz=3;if(p.hp<=0)die(p)}
function contact(dt){const es=localEnts();for(const m of mons){m.ccd-=dt;if(m.web>0||m.ccd>0)continue;const t=MT[m.t],r=t.boss?36:22;
 for(const e of es)if(Math.abs(e.x-m.x)<r&&Math.abs(e.y-m.y)<r&&Math.hypot(e.x-m.x,e.y-m.y)<r){m.ccd=1;hurtEnt(e,t.dm*(m.dash>0?1.6:1),t.ps);break}}}

function enemySkill(m,t,tg,nd){if(m.scd>0||!t.es)return;

 if(state==="naming"){const g=padNow.find(q=>q&&(q.pr[0]||q.pr[9])),l=KP.ArrowLeft||padNow.some(q=>q&&(q.pr[14]||q.se==="l")),r=KP.ArrowRight||padNow.some(q=>q&&(q.pr[15]||q.se==="r"));

  if(mi.ok){const i=treeSel;if(!p.sk[i]&&p.sp>0&&(i%3===0||p.sk[i-1])){p.sk[i]=1;p.sp--;if(i===3)p.hp+=30;sfx("lvl");saveDirty=1}else sfx("hurt")}
